name: Check for Android Studio Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get Current Version from Spec
        id: spec
        run: |
          CURRENT_VERSION=$(grep -E '^Version:' android-studio.spec | awk '{print $2}')
          if [ -z "$CURRENT_VERSION" ]; then
            echo "Could not extract Version from spec"
            exit 1
          fi
          echo "Current spec version: $CURRENT_VERSION"
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Fetch Latest Version from Google
        id: remote
        run: |
          echo "Downloading Android Studio metadata..."

          JSON=$(curl -fsSL https://developer.android.com/studio/archive.json)

          if [ -z "$JSON" ]; then
            echo "Failed to download archive.json"
            exit 1
          fi

          # Get latest stable release
          LATEST_VERSION=$(echo "$JSON" | jq -r '.releases[0].version')

          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "Failed to parse latest version"
            exit 1
          fi

          echo "Latest remote version: $LATEST_VERSION"
          echo "version=$LATEST_VERSION" >> $GITHUB_OUTPUT

      - name: Compare Versions
        id: compare
        run: |
          SPEC_VER="${{ steps.spec.outputs.version }}"
          REMOTE_VER="${{ steps.remote.outputs.version }}"

          echo "Spec version: $SPEC_VER"
          echo "Remote version: $REMOTE_VER"

          # sort -V ensures correct semantic comparison
          if [ "$(printf '%s\n' "$SPEC_VER" "$REMOTE_VER" | sort -V | tail -n 1)" = "$REMOTE_VER" ] && [ "$SPEC_VER" != "$REMOTE_VER" ]; then
            echo "New version detected."
            echo "update=true" >> $GITHUB_OUTPUT
          else
            echo "No update required."
            echo "update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update Spec File and Push
        if: steps.compare.outputs.update == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          NEW_VER="${{ steps.remote.outputs.version }}"

          echo "Updating spec to version $NEW_VER"

          sed -i "s/^Version:.*/Version:        $NEW_VER/" android-studio.spec
          sed -i "s/^Release:.*/Release:        0/" android-studio.spec

          git add android-studio.spec
          git commit -m "Automated version bump to $NEW_VER"
          git push
